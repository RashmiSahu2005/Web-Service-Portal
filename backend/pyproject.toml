[project]
name = "application-hub-backend"
version = "0.1.0"
description = "Backend for Application Hub"
requires-python = ">=3.10"
dependencies = [
    "celery>=5.4.0",
    "fastapi>=0.110.0",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "langgraph>=1.2.10",
    "mcp>=1.29.0",
    "packaging>=26.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
