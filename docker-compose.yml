version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: deployiq-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deployiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Welcome@2026}
      POSTGRES_DB: ${POSTGRES_DB:-deployiq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployiq_user -d deployiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deployiq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deployiq-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/repository:/app/repository

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deployiq-celery-worker
    restart: always
    command: celery -A app.services.celery_app.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/repository:/app/repository

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deployiq-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
